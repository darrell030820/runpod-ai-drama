name: Build H3 RunPod image
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free space on disposable GitHub runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
          free_kb=$(df --output=avail / | tail -1)
          if [ "$free_kb" -lt 26000000 ]; then
            echo "Need at least 26 GB free for the CUDA image build. Use a larger hosted runner."
            exit 1
          fi
      - name: Set lowercase image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/h3-comfy" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:h3-2026-09-13
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
      - name: Show RunPod image
        env:
          IMAGE: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
        run: echo "RunPod Container Image = $IMAGE" >> "$GITHUB_STEP_SUMMARY"
